
name: Update NFL historical stats

on:
  push:
    branches: [v8-2-testing]
    paths:
      - 'evaluate_contests.py'
      - 'test_feedback.py'
      - 'data/pregame/**'
      - '.github/workflows/update-nfl.yml'
  workflow_dispatch:
      # Enable manual testing
  schedule:
    - cron: '17 13 * * 2,4,6'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python update_stats.py
      - run: python -m unittest test_feedback.py
      - run: python evaluate_contests.py

      - name: Commit updated NFL data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl_baselines.json data/nfl_matchups.json data/model_feedback.json data/model_config.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NFL player stats and matchups"
            git push
          fi
