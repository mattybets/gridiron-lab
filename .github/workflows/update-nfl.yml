
name: Update NFL historical stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 2,4,6'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_stats.py
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl_baselines.json
          if ! git diff --cached --quiet; then git commit -m "Refresh NFL historical baselines" && git push; fi
